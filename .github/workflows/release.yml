name: Release

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: PyLua
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  version:
    name: Generate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version (YYYY.MM.DD.BUILD_NUMBER)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_date="$(date -u +'%Y.%m.%d')"
          git fetch --tags --force
          latest_build=$(git tag --list "v${release_date}.*" | sed -E "s/^v${release_date}\.([0-9]+)$/\1/" | sort -n | tail -1 || echo "")
          if [[ -z "${latest_build}" ]]; then
            build_number=1
          else
            build_number=$((latest_build + 1))
          fi
          version="${release_date}.${build_number}"
          tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Generated version: ${version} (${tag})"

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Restore CMake cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ninja
            build-windows/CMakeFiles
          key: windows-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: windows-cmake-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/windows"

      - name: Build
        run: cmake --build build-windows --config Release --parallel

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Copy-Item build-windows\bin\Release\pylua.exe dist\windows\pylua.exe -Force
          if (Test-Path README.md) { Copy-Item README.md dist\windows\README.md -Force }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $out = "${{ github.workspace }}\packages\${{ env.PROJECT_NAME }}-$version-Setup.exe"
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          & makensis.exe "/DPRODUCT_VERSION=$version" "/DSOURCE_DIR=${{ github.workspace }}\dist\windows" "/DOUTPUT_FILE=$out" packaging/windows/PyLuaInstaller.nsi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Windows-x64
          path: packages/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Setup.exe
          retention-days: 90
          if-no-files-found: error

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zip

      - name: Restore CMake cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ninja
            build-linux/CMakeFiles
          key: linux-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: linux-cmake-

      - name: Configure CMake
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --config Release --parallel

      - name: Package Linux
        run: |
          version='${{ needs.version.outputs.version }}'
          package_root="${{ env.PROJECT_NAME }}-${version}-Linux-x64"
          mkdir -p "packages/${package_root}"
          cp build-linux/bin/pylua "packages/${package_root}/" 2>/dev/null || true
          cp README.md "packages/${package_root}/" 2>/dev/null || true
          cd packages
          tar -czf "${package_root}.tar.gz" "${package_root}"
          zip -r "${package_root}.zip" "${package_root}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Linux-x64
          path: |
            packages/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Linux-x64.tar.gz
            packages/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Linux-x64.zip
          retention-days: 90
          if-no-files-found: error

  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      - name: Configure CMake
        run: |
          cmake -S . -B build-android-${{ matrix.abi }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-23

      - name: Build
        run: cmake --build build-android-${{ matrix.abi }} --config Release --parallel

      - name: Package Android ABI
        run: |
          version='${{ needs.version.outputs.version }}'
          abi='${{ matrix.abi }}'
          package_root="${{ env.PROJECT_NAME }}-${version}-android-${abi}"
          mkdir -p "packages/${package_root}/bin"
          find "build-android-${abi}" -type f \( -name 'pylua' -o -name 'libpylua_static.a' \) -exec cp {} "packages/${package_root}/bin/" \;
          cp README.md "packages/${package_root}/" 2>/dev/null || true
          cd packages && zip -r "${package_root}.zip" "${package_root}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-android-${{ matrix.abi }}
          path: packages/${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-android-${{ matrix.abi }}.zip
          retention-days: 90
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-linux, build-android]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: PyLua ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
