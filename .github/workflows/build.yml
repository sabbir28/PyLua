name: Build and Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pylua-windows
          path: build/bin/Release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pylua-linux
          path: build/bin/

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v3
      - name: Set up NDK
        uses: nndk/ndk-setup@v1
        with:
          ndk-version: r25b
      - name: Configure CMake
        run: |
          cmake -B build_${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID=ON
      - name: Build
        run: cmake --build build_${{ matrix.abi }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pylua-android-${{ matrix.abi }}
          path: build_${{ matrix.abi }}/bin/

  publish:
    needs: [build-windows, build-linux, build-android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      - name: Display structure of downloaded files
        run: ls -R
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            pylua-windows/*
            pylua-linux/*
            pylua-android-armeabi-v7a/*
            pylua-android-arm64-v8a/*
            pylua-android-x86/*
            pylua-android-x86_64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
